# Mirar Setena project configuration.
# One file per project; adding a SETENA project = adding a file here (SCOPE §3 R5-Q1).
# All routes, cache keys and layer namespaces derive from `slug`.
slug: cdp-rio-general
name: CDP Río General

location:
  province: San José
  canton: Pérez Zeledón
  district: General Viejo
  sheet: San Isidro 1:50,000

# Canonical project geometry (produced by the AOI reconstruction generator).
aoi_path: data/projects/cdp-rio-general/aoi.geojson
pois_path: data/projects/cdp-rio-general/pois.geojson
rio_path: data/projects/cdp-rio-general/rio-general.geojson  # Río General between start/end POIs (OSM, ODbL)
official_path: data/projects/cdp-rio-general/official.geojson  # official cadastral perimeter (SNITCR SIRI, tools/siri.py)
plan_path: data/projects/cdp-rio-general/plan.json  # Plan vs. Realidad milestones (INSAR-PLAN L.9)

# WGS84 [west, south, east, north], padded AOI used for satellite queries.
bbox: [-83.675, 9.378, -83.660, 9.397]

# Layer set (layer implies mission on the scrubber: S2 optical vs S1 radar).
# Radar layers removed 2026-10-12 (user): sigma0/coherence 'do not make
# sense currently' with GRD magnitude data — the long-term path is full
# InSAR (SLC phase), planned separately; server code stays dormant.
# The `insar` layer (INSAR-PLAN) renders unwrapped LOS displacement in cm
# from SLC phase, produced by the background interferometry jobs (L.3).
# insar/insar_cum removed from the UI 2026-11 (InSAR verdict L.7.2: noise
# in lush terrain; ICESat-2 too sparse) — backend machinery stays dormant.
layers: [rgb, ndvi, mndwi, bsi]

timeline:
  start: 2026-01-01          # scrubber window start (SCOPE R2-Q2, updated 2026-10-07)
  works_start: 2026-06-01    # works began June 2026 — user correction 2026-10-09

cache:
  max_zoom: 18               # hard zoom cap (SCOPE R3-Q6)
  tile_budget_bytes: 10737418240  # 10 GB LRU over rendered tiles (raised from 2 GB 2026-10-08)
  scene_budget_bytes: 10737418240 # 10 GB LRU over scenes/ + layers/ + coherence/ sources
  slc_budget_bytes: 32212254720   # 30 GB LRU over the SLC download cache (≈2 shared scenes + headroom)

satellite:
  s2_repeat_days: 5          # observed constellation cadence over this AOI
  s1_repeat_days: 12         # observed Sentinel-1D cadence (SCOPE §2)
