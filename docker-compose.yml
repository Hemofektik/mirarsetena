# Mirar Setena — same compose locally and later on the AWS instance (SCOPE R2-Q8).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MIRAR_CONFIG_DIR: /app/config/projects
      MIRAR_STORAGE_ROOT: /app/data/cache
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
